name: Validate static dashboard

on:
  push:
  pull_request:

jobs:
  data-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_weather_data.py
      - run: python scripts/validate_data.py
