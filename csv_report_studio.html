<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CSV Report Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <style>
    :root{--bg:#071426;--panel:#101f37;--text:#eaf1fc;--muted:#a4b3c9;--line:#2a3e5e;--blue:#63a8ff;--green:#3cd6ae;--radius:18px}*{box-sizing:border-box}body{margin:0;color:var(--text);font:14px Inter,system-ui,Segoe UI,sans-serif;background:radial-gradient(950px 630px at 6% -10%,#1d4f9180,transparent 58%),radial-gradient(750px 550px at 95% 8%,#08765660,transparent 52%),var(--bg)}header,main{max-width:1240px;margin:auto;padding:22px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:18px}h1{font-size:26px;margin:0 0 6px;letter-spacing:-.5px}h2{font-size:15px;margin:0}p{color:var(--muted);margin:0;line-height:1.45}.back{color:#c9dcff;text-decoration:none;font-size:13px;padding:9px 12px;border:1px solid #ffffff22;border-radius:9px}.back:hover{background:#ffffff12}.upload{position:relative;display:block;overflow:hidden;border:1.5px dashed #4d78ae;border-radius:var(--radius);padding:36px;text-align:center;background:linear-gradient(115deg,#10284aaa,#102a3a99);cursor:pointer;transition:.2s}.upload:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0,#63a8ff2e,transparent 42%);pointer-events:none}.upload:hover,.upload.dragging{border-color:var(--blue);background:#15345baa;transform:translateY(-1px)}.upload-icon{position:relative;display:grid;place-items:center;width:54px;height:54px;margin:0 auto 13px;border-radius:16px;background:#63a8ff22;border:1px solid #63a8ff44;color:#a9ceff;font-size:25px}.upload strong,.upload span,.upload small{position:relative;display:block}.upload strong{font-size:17px;margin-bottom:7px}.upload span{color:var(--muted)}.upload small{margin-top:15px;color:#75a9e9;font-size:12px;font-weight:600}.file-loaded{border-style:solid;border-color:#3cd6ae;background:linear-gradient(115deg,#123744,#112d3c)}input[type=file]{display:none}.grid{display:grid;grid-template-columns:260px 1fr;gap:16px;margin-top:16px}.card{background:#101f37df;border:1px solid #ffffff18;border-radius:var(--radius);overflow:hidden;box-shadow:0 14px 32px #0000001a}.hd{padding:15px 17px;border-bottom:1px solid #ffffff14}.bd{padding:16px}.controls label{display:block;color:var(--muted);font-size:12px;margin:0 0 14px}.controls select,.controls input,button{width:100%;margin-top:6px;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0c192d;color:var(--text);font:inherit}button{cursor:pointer;background:linear-gradient(#4389e7,#2865b9);border-color:#70adff;font-weight:700;transition:.15s}button:hover{filter:brightness(1.12);transform:translateY(-1px)}button.secondary{background:#ffffff0b;border-color:#ffffff22;margin-top:8px}.hidden{display:none!important}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.kpi{padding:15px;border:1px solid #ffffff14;border-radius:12px;background:#0c192d}.kpi b{display:block;font-size:23px;margin-top:6px}.kpi span{color:var(--muted);font-size:12px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}.chart-card{min-height:350px}.chart-card canvas{width:100%!important;height:280px!important}.insights{padding-left:20px}.insights li{margin:10px 0;color:#dce6f6;line-height:1.4}.recommendations{margin:0;padding:0;list-style:none}.recommendations li{display:flex;gap:9px;margin:12px 0;color:#dce6f6;line-height:1.42}.recommendations li:before{content:'✓';display:grid;place-items:center;flex:0 0 19px;height:19px;border-radius:50%;background:#3cd6ae22;color:#56e6c0;font-size:11px;font-weight:800}.recommendations strong{color:#fff}.preview{max-height:280px;overflow:auto;border:1px solid #ffffff12;border-radius:10px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:9px;text-align:left;border-bottom:1px solid #ffffff12;white-space:nowrap}th{background:#162b4b;position:sticky;top:0}@media(max-width:1000px){.summary{grid-template-columns:repeat(3,1fr)}}@media(max-width:850px){.grid{grid-template-columns:1fr}.summary,.charts{grid-template-columns:1fr 1fr}}@media(max-width:520px){header{align-items:flex-start;flex-direction:column}.summary,.charts{grid-template-columns:1fr}.upload{padding:28px 16px}}
  </style>
</head>
<body>
  <header><div><h1>CSV Report Studio</h1><p>Turn a CSV file into a visual report in seconds.</p></div><a class="back" href="weather_dashboard.html">← Weather dashboard</a></header>
  <main>
    <label class="upload" id="dropZone"><input id="csvFile" type="file" accept=".csv,text/csv"><div class="upload-icon">↑</div><strong id="uploadTitle">Drop your CSV file here</strong><span id="uploadText">Drag and drop a file, or click to browse from your computer.</span><small id="uploadHint">CSV files only · Your data stays private in your browser</small></label>
    <div id="workspace" class="grid hidden">
      <aside class="card"><div class="hd"><h2>Report settings</h2></div><div class="bd controls">
        <label>Category / label column<select id="category"></select></label>
        <label>Numeric value column<select id="metric"></select></label>
        <label>Chart type<select id="chartType"><option value="bar">Bar chart</option><option value="line">Line chart</option><option value="doughnut">Donut chart</option></select></label>
        <label>Aggregation<select id="aggregation"><option value="sum">Sum</option><option value="average">Average</option><option value="count">Count records</option></select></label>
        <button id="update">Update report</button><button class="secondary" id="download">Download PowerPoint (.pptx)</button>
      </div></aside>
      <section>
        <div class="summary" id="summary"></div>
        <div class="charts"><article class="card chart-card"><div class="hd"><h2 id="chartTitle">Distribution</h2></div><div class="bd"><canvas id="mainChart"></canvas></div></article><article class="card chart-card"><div class="hd"><h2>Data insights</h2></div><div class="bd"><ul class="insights" id="insights"></ul></div></article></div>
        <article class="card" style="margin-top:16px"><div class="hd"><h2>Recommendations</h2><span style="color:var(--muted);font-size:12px">Based on the selected data view</span></div><div class="bd"><ul class="recommendations" id="recommendations"></ul></div></article>
        <article class="card" style="margin-top:16px"><div class="hd"><h2>Data preview</h2></div><div class="bd"><div class="preview" id="preview"></div></div></article>
      </section>
    </div>
  </main>
  <script>
    let rows=[], columns=[], chart, fileName='CSV Report';
    const $=id=>document.getElementById(id), palette=['#60a5fa','#34d399','#fbbf24','#fb7185','#a78bfa','#2dd4bf','#f97316','#38bdf8'];
    function parseCSV(text){const out=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell.trim());if(row.some(x=>x!==''))out.push(row);row=[];cell=''}else cell+=c}row.push(cell.trim());if(row.some(x=>x!==''))out.push(row);return out}
    const num=v=>{const n=Number(String(v??'').replace(/[$,%\s,]/g,''));return Number.isFinite(n)?n:null};
    function chooseDefaults(){const numeric=columns.find(c=>rows.filter(r=>num(r[c])!==null).length>rows.length*.6)||columns[0];$('category').value=columns.find(c=>c!==numeric)||columns[0];$('metric').value=numeric}
    function setup(data,name){const raw=parseCSV(data);if(raw.length<2){alert('Please upload a CSV with a header row and at least one record.');return}columns=raw[0].map((x,i)=>x||`Column ${i+1}`);rows=raw.slice(1).map(r=>Object.fromEntries(columns.map((c,i)=>[c,r[i]??''])));fileName=name.replace(/\.csv$/i,'')||'CSV Report';for(const id of ['category','metric'])$(id).innerHTML=columns.map(c=>`<option>${escapeHtml(c)}</option>`).join('');chooseDefaults();$('uploadTitle').textContent='✓ '+name+' is ready';$('uploadText').textContent=`${rows.length.toLocaleString()} records and ${columns.length} columns detected.`;$('uploadHint').textContent='Click here to replace this file';$('dropZone').classList.add('file-loaded');$('workspace').classList.remove('hidden');render()}
    const escapeHtml=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function reportData(){const cat=$('category').value, metric=$('metric').value, agg=$('aggregation').value,map=new Map();rows.forEach(r=>{const key=r[cat]||'Blank', value=num(r[metric]);let x=map.get(key)||{sum:0,count:0};if(agg==='count'||value!==null){x.sum+=value??0;x.count++}map.set(key,x)});return [...map].map(([label,x])=>({label,value:agg==='average'?x.sum/x.count:agg==='count'?x.count:x.sum})).sort((a,b)=>b.value-a.value).slice(0,12)}
    function render(){const data=reportData(),metric=$('metric').value,cat=$('category').value,values=rows.map(r=>num(r[metric])).filter(v=>v!==null),total=values.reduce((a,b)=>a+b,0),avg=values.length?total/values.length:0;$('summary').innerHTML=`<div class="kpi"><span>Records</span><b>${rows.length.toLocaleString()}</b></div><div class="kpi"><span>Columns</span><b>${columns.length}</b></div><div class="kpi"><span>Numeric values</span><b>${values.length.toLocaleString()}</b></div><div class="kpi"><span>Average ${escapeHtml(metric)}</span><b>${values.length?avg.toLocaleString(undefined,{maximumFractionDigits:2}):'—'}</b></div>`;$('chartTitle').textContent=`${$('aggregation').value} of ${metric} by ${cat}`;if(chart)chart.destroy();chart=new Chart($('mainChart'),{type:$('chartType').value,data:{labels:data.map(x=>x.label),datasets:[{label:metric,data:data.map(x=>x.value),backgroundColor:data.map((_,i)=>palette[i%palette.length]+'99'),borderColor:palette,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:$('chartType').value==='doughnut'?{}:{y:{beginAtZero:true},x:{ticks:{maxRotation:35,minRotation:0}}}}});const best=data[0],lowest=data.at(-1);$('insights').innerHTML=`<li><b>${rows.length.toLocaleString()}</b> records were loaded from <b>${escapeHtml(fileName)}</b>.</li><li>The largest ${$('aggregation').value} is <b>${escapeHtml(best?.label||'—')}</b> (${best?.value?.toLocaleString(undefined,{maximumFractionDigits:2})||'—'}).</li><li>The lowest displayed category is <b>${escapeHtml(lowest?.label||'—')}</b>.</li><li>The chart shows the top ${data.length} categories; change the fields or aggregation to explore another view.</li>`;$('preview').innerHTML='<table><thead><tr>'+columns.map(c=>`<th>${escapeHtml(c)}</th>`).join('')+'</tr></thead><tbody>'+rows.slice(0,20).map(r=>'<tr>'+columns.map(c=>`<td>${escapeHtml(r[c])}</td>`).join('')+'</tr>').join('')+'</tbody></table>'}
    function render(){const data=reportData(),metric=$('metric').value,cat=$('category').value,values=rows.map(r=>num(r[metric])).filter(v=>v!==null),total=values.reduce((a,b)=>a+b,0),avg=values.length?total/values.length:0,max=values.length?Math.max(...values):null,min=values.length?Math.min(...values):null,complete=rows.length?Math.round(values.length/rows.length*100):0,fmt=v=>Number.isFinite(v)?v.toLocaleString(undefined,{maximumFractionDigits:2}):'—';$('summary').innerHTML=`<div class="kpi"><span>Records</span><b>${rows.length.toLocaleString()}</b></div><div class="kpi"><span>Columns</span><b>${columns.length}</b></div><div class="kpi"><span>Numeric values</span><b>${values.length.toLocaleString()}</b></div><div class="kpi"><span>Data completeness</span><b>${complete}%</b></div><div class="kpi"><span>Average ${escapeHtml(metric)}</span><b>${fmt(avg)}</b></div><div class="kpi"><span>Total ${escapeHtml(metric)}</span><b>${fmt(total)}</b></div><div class="kpi"><span>Highest value</span><b>${fmt(max)}</b></div><div class="kpi"><span>Lowest value</span><b>${fmt(min)}</b></div>`;$('chartTitle').textContent=`${$('aggregation').value} of ${metric} by ${cat}`;if(chart)chart.destroy();chart=new Chart($('mainChart'),{type:$('chartType').value,data:{labels:data.map(x=>x.label),datasets:[{label:metric,data:data.map(x=>x.value),backgroundColor:data.map((_,i)=>palette[i%palette.length]+'99'),borderColor:palette,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:$('chartType').value==='doughnut'?{}:{y:{beginAtZero:true},x:{ticks:{maxRotation:35,minRotation:0}}}}});const best=data[0],lowest=data.at(-1),share=best&&total?best.value/total*100:0;$('insights').innerHTML=`<li><b>${rows.length.toLocaleString()}</b> records were loaded from <b>${escapeHtml(fileName)}</b>.</li><li>The largest ${$('aggregation').value} is <b>${escapeHtml(best?.label||'—')}</b> (${fmt(best?.value)}).</li><li>The lowest displayed category is <b>${escapeHtml(lowest?.label||'—')}</b>.</li><li>The chart shows the top ${data.length} categories; change the fields or aggregation to explore another view.</li>`;$('recommendations').innerHTML=`<li><span><strong>Prioritise ${escapeHtml(best?.label||'the leading category')}.</strong> It represents ${fmt(share)}% of the selected ${$('aggregation').value} and should be reviewed first.</span></li><li><span><strong>Check data quality before decisions.</strong> ${complete}% of records contain a usable value for ${escapeHtml(metric)}${complete<95?', so investigate missing entries or collection gaps.':'.'}</span></li><li><span><strong>Compare the highest and lowest values.</strong> The range is ${fmt(max!==null&&min!==null?max-min:NaN)}, which can help identify variation, exceptions, or opportunities.</span></li><li><span><strong>Create a focused follow-up view.</strong> Filter or segment ${escapeHtml(cat)} to understand what is driving the largest category.</span></li>`;$('preview').innerHTML='<table><thead><tr>'+columns.map(c=>`<th>${escapeHtml(c)}</th>`).join('')+'</tr></thead><tbody>'+rows.slice(0,20).map(r=>'<tr>'+columns.map(c=>`<td>${escapeHtml(r[c])}</td>`).join('')+'</tr>').join('')+'</tbody></table>'}
    async function download(){if(!window.PptxGenJS){alert('PowerPoint export library did not load. Check your internet connection and try again.');return}const pptx=new PptxGenJS();pptx.layout='LAYOUT_WIDE';pptx.author='CSV Report Studio';const slide=pptx.addSlide();slide.background={color:'0B1220'};slide.addText(fileName,{x:.55,y:.35,w:8,h:.45,fontSize:27,bold:true,color:'E5E7EB'});slide.addText('CSV visual report · generated '+new Date().toLocaleDateString(),{x:.57,y:.9,w:8,h:.25,fontSize:11,color:'9CA3AF'});const cards=[['Records',String(rows.length)],['Columns',String(columns.length)],['Metric',$('metric').value]];cards.forEach((x,i)=>{slide.addShape(pptx.ShapeType.roundRect,{x:.55+i*2.25,y:1.35,w:2.05,h:.8,rectRadius:.08,fill:{color:'111B30'},line:{color:'263756'}});slide.addText(x[0],{x:.72+i*2.25,y:1.53,w:1.7,h:.18,fontSize:10,color:'9CA3AF'});slide.addText(x[1],{x:.72+i*2.25,y:1.75,w:1.7,h:.22,fontSize:15,bold:true,color:'E5E7EB',fit:'shrink'})});slide.addImage({data:chart.toBase64Image(),x:.55,y:2.45,w:7.2,h:3.55});slide.addText('Key insights',{x:8.05,y:2.45,w:4,h:.25,fontSize:16,bold:true,color:'E5E7EB'});const data=reportData();slide.addText($('insights').innerText,{x:8.05,y:2.85,w:4.5,h:2.5,fontSize:12,color:'D5DBEA',breakLine:false,margin:.06,bullet:{indent:12}});slide.addText(`Top category: ${data[0]?.label||'—'}`,{x:.58,y:6.25,w:7,h:.25,fontSize:11,color:'9CA3AF'});await pptx.writeFile({fileName:`${fileName.replace(/[^a-z0-9]+/gi,'_')}_report.pptx`})}
    function loadFile(f){if(!f)return;if(!/\.csv$/i.test(f.name)){alert('Please choose a CSV file.');return}$('uploadTitle').textContent='Preparing your report…';$('uploadText').textContent='Reading columns and records.';const r=new FileReader();r.onload=()=>setup(r.result,f.name);r.readAsText(f)}$('csvFile').addEventListener('change',e=>loadFile(e.target.files[0]));$('dropZone').addEventListener('dragover',e=>{e.preventDefault();$('dropZone').classList.add('dragging')});$('dropZone').addEventListener('dragleave',()=>$('dropZone').classList.remove('dragging'));$('dropZone').addEventListener('drop',e=>{e.preventDefault();$('dropZone').classList.remove('dragging');loadFile(e.dataTransfer.files[0])});$('update').onclick=render;$('download').onclick=download;
  </script>
</body></html>
